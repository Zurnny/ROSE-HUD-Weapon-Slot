[Mod]
Name=HUD Weapon Slot
Version=1.5
Author=Zurnny
Group=
Description=Shows your equipped weapon (or your ammo, when you have some equipped) in a slot beside the HP, MP and EXP bars, with its durability, life and refine like the inventory shows them. Switch: Options > UI > Add-ons.\nAdd-on for the game's default UI and the Steampunk UI theme. Works on its own or together with any of the other add-ons: they share their Options page, each adding its own line. Each window checks which of the two is installed and uses its look.
Changes=Weapon Refresh: the HUD weapon slot reloads when its numbers change, again 5 seconds later (the game lags by one hit), and whenever you hover it, so its tooltip matches the inventory.
Priority=5
UpdateUrl=https://raw.githubusercontent.com/Zurnny/ROSE-HUD-Weapon-Slot/main/HUD%20Weapon%20Slot/manifest.txt
