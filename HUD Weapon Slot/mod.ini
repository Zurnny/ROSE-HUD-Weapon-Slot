[Mod]
Name=HUD Weapon Slot
Version=1.15
Author=Zurnny
Group=
Description=Shows your equipped weapon (or your ammo, when you have some equipped) in a slot beside the HP, MP and EXP bars, with its durability, life and refine like the inventory shows them, kept up to date during fights (this used to be the separate Weapon Refresh add-on). Switch: the Add-ons button in the menu.\nAdd-on for the game's default UI and the Steampunk UI theme. Works on its own or together with any of the other add-ons: they share their Options page, each adding its own line. Each window checks which of the two is installed and uses its look.
Changes=Fixes a freeze when ticking a Dropped Items box in the Add-ons window. New: Group Leader colour in Message Colours; Minimap Window's compass ring with its own switch and map turning; Weapon Refresh merged into HUD Weapon Slot; the default UI Add-ons button uses the game's own button look.
Priority=5
UpdateUrl=https://raw.githubusercontent.com/Zurnny/ROSE-HUD-Weapon-Slot/main/HUD%20Weapon%20Slot/manifest.txt
